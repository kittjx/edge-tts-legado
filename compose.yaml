services:
  edge-tts:
    build: .
    image: edge-tts-legado:latest
    container_name: edge-tts-legado
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。改宿主机端口用 HOST_PORT，容器内固定 3000
      - "${HOST_PORT:-3000}:${HOST_PORT:-3000}"
    environment:
      PORT: "${HOST_PORT:-3000}"
      HOST: "0.0.0.0"
      # 同时向微软发起的合成请求数，被限流/断连时调小
      CONCURRENCY: "${CONCURRENCY:-2}"
      # 访问令牌，留空表示不鉴权；公网部署务必设置
      TOKEN: "${TOKEN:-}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
