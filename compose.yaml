services:
  edge-tts:
    build: .
    image: edge-tts-legado:latest
    container_name: edge-tts-legado
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:${HOST_PORT:-3000}"
    environment:
      PORT: "${HOST_PORT:-3000}"
      HOST: "0.0.0.0"
      CONCURRENCY: "${CONCURRENCY:-2}"
      TOKEN: "${TOKEN:-}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
